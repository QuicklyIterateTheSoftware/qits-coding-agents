# This repository's qits configuration — the single source of truth for its services, actions and
# bootstrap chain. It is read in-container per workspace from your branch's checkout, so changing it
# is an ordinary commit and takes effect in every workspace whose branch carries it.
#
# `repository.archetype` is deliberately absent: the directory this repository is mounted under in
# its project's wrapper decides that, and a value here would only be a second opinion.
version: 1

repository:
  main-branch: main

# No services. This is a library reactor with no deployable and nothing to run — the two jars it
# publishes are embedded by qits-projects-daemon and qits-workspace-daemon, and it is those daemons
# that have a process.

# One-shot commands runnable from the workspace. `verify` is the same command the release-request
# pipeline runs (see release.yml), so a green action here is the gate the release request will meet.
actions:
  - name: verify
    execute: ./mvnw -B -ntp verify
  - name: test
    execute: ./mvnw -B -ntp test

# No bootstrap chain: mvnw resolves what it needs on the first build, and pre-warming it would only
# move the same download earlier.
